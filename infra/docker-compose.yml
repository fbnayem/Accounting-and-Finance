name: acct

# Phase 0 local stack. Started by `pnpm stack:up` (the one documented command).
#
# PostgreSQL is pinned to 16 by ADR-0008 §1: the schema depends on
# UNIQUE NULLS NOT DISTINCT (15+), btree_gist exclusion constraints, deferrable
# constraint triggers and composite foreign keys. Downgrading breaks migrations,
# not just performance.

# Host ports are deliberately non-default (55432 / 55433 / 56379 / 9100).
# A developer machine very often already runs PostgreSQL on 5432 or Redis on 6379,
# and the failure that causes is nasty: the container binds, the connection
# succeeds, and it reaches somebody else's database. Non-default ports make a
# misconfiguration a connection refusal instead of a silent wrong-server write.

services:
  postgres:
    image: postgres:16-alpine
    container_name: acct_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acct_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-acct}
      # Deterministic collation, so ORDER BY in golden fixtures is reproducible
      # across a developer laptop and CI.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      # Surfaces the ADR-0004 lock-ordering defects loudly in development.
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-acct} -d ${POSTGRES_DB:-acct}']
      interval: 3s
      timeout: 3s
      retries: 20

  # Separate database for integration tests, so `pnpm test:integration` never
  # truncates a developer's working data.
  postgres_test:
    image: postgres:16-alpine
    container_name: acct_postgres_test
    environment:
      POSTGRES_USER: acct
      POSTGRES_PASSWORD: acct_test_password
      POSTGRES_DB: acct_test
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '${POSTGRES_TEST_PORT:-55433}:5432'
    # tmpfs: the test database is disposable and this makes the suite markedly faster.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acct -d acct_test']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: acct_redis
    ports:
      - '${REDIS_PORT:-56379}:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for the local stack (doc 16 storage abstraction).
  minio:
    image: minio/minio:latest
    container_name: acct_minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-acct_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-acct_minio_password}
    ports:
      - '${S3_PORT:-9100}:9000'
      - '${S3_CONSOLE_PORT:-9101}:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio_bootstrap:
    image: minio/mc:latest
    container_name: acct_minio_bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-acct_minio} ${S3_SECRET_ACCESS_KEY:-acct_minio_password};
      mc mb --ignore-existing local/${S3_BUCKET:-acct-files};
      mc anonymous set none local/${S3_BUCKET:-acct-files};
      echo 'bucket ready';
      "
    restart: 'no'

  # Structured-log viewer and trace target. Phase 0 exit criterion 5 (correlation
  # ID across API and worker) is demonstrable without it, but this makes it visible.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: acct_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
      - '${OTLP_PORT:-4318}:4318'
    profiles: ['observability']

volumes:
  postgres_data:
  redis_data:
  minio_data:
