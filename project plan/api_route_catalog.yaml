    - POST /fiscal-years
    - GET /accounting-periods
    - POST /accounting-periods/{id}/soft-close
    - POST /accounting-periods/{id}/hard-close
    - POST /accounting-periods/{id}/reopen
    - GET /currencies
    - GET /exchange-rates
    - POST /exchange-rates
    - GET /accounting-books
  ledger:
