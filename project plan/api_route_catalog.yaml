    - POST /accounts
    - PATCH /accounts/{id}
    - GET /dimensions
    - POST /dimensions
    - GET /dimension-values
    - POST /dimension-values
    - GET /journals
    - POST /journals
    - GET /journals/{id}
    - POST /journals/{id}/submit
    - POST /journals/{id}/approve
    - POST /journals/{id}/post
    - POST /journals/{id}/reverse
    - POST /accounting-events/simulate
    - GET /ledger/accounts/{id}/activity
