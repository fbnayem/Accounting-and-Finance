    - POST /goods-receipts
    - GET /vendor-bills
    - POST /vendor-bills
    - POST /vendor-bills/{id}/match
    - POST /vendor-bills/{id}/approve
    - POST /vendor-bills/{id}/post
    - GET /vendor-credits
    - POST /vendor-credits
    - GET /payment-runs
    - POST /payment-runs
    - POST /payment-runs/{id}/approve
    - POST /payment-runs/{id}/execute
    - GET /expense-claims
    - POST /expense-claims
  banking:
