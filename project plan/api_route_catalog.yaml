version: v1
base_path: /api/v1
conventions:
  auth: Bearer token/session; OAuth2 for public integrations
  tenant_scope: required on every business resource
  idempotency: Idempotency-Key required/recommended on retriable financial POST commands
  pagination: cursor based for large collections
  errors: structured code, message, field_errors, correlation_id
  dates: ISO-8601
  money: decimal strings in API contracts, never binary floating point
  optimistic_concurrency: version/etag on mutable setup and draft resources where useful

routes:
  auth:
    - POST /auth/login
    - POST /auth/refresh
    - POST /auth/logout
    - POST /auth/mfa/challenge
    - POST /auth/mfa/verify
  organizations:
    - GET /organizations
    - POST /organizations
    - GET /organizations/{id}
    - PATCH /organizations/{id}
    - GET /legal-entities
    - POST /legal-entities
    - GET /branches
    - POST /branches
  iam:
    - GET /users
    - POST /users/invite
    - GET /roles
    - POST /roles
    - PATCH /roles/{id}
    - GET /permissions
  finance_setup:
