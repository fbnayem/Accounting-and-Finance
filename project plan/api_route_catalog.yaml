    - PATCH /invoices/{id}
    - POST /invoices/{id}/approve
    - POST /invoices/{id}/post
    - POST /invoices/{id}/send
    - POST /invoices/{id}/void-or-credit
    - GET /credit-notes
    - POST /credit-notes
    - GET /customer-receipts
    - POST /customer-receipts
    - POST /customer-receipts/{id}/allocate
    - POST /customer-refunds
  vendors_ap:
