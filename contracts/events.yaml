# Canonical Domain Event Contract
#
# SINGLE SOURCE OF TRUTH. Supersedes both `project plan/blueprints/event_catalog.json`
# and the "## Events" sections of the module specifications, which disagreed with each
# other on 22 names and omitted 25 required events (audit F-101, F-102).
#
# Event types are IMMUTABLE once published. A breaking payload change requires a new
# `version`, never an edit in place.

version: 1
generated: 2026-08-07
supersedes:
  - project plan/blueprints/event_catalog.json
  - module specification "## Events" sections (docs 02-24)

# ---------------------------------------------------------------------------
naming:
  pattern: "<aggregate>.<past_tense_verb>"
  rules:
    - Aggregate name matches the schema table's singular form.
    - Verb is past tense; an event records something that has happened.
    - No unprefixed aggregates. `transfer.` and `reconciliation.` were ambiguous
      across banking and close; they are `bank_transfer.` and `bank_reconciliation.`.
    - A lifecycle state that the platform gates on gets its own event. `accounting_period.closed`
      is forbidden because soft and hard close are different states with different consequences.

# ---------------------------------------------------------------------------
envelope:
  required:
    - event_id            # globally unique; the idempotency key for every consumer
    - event_type
    - event_version
    - tenant_id
    - organization_id
    - legal_entity_id     # null only for platform-scope events (see scope: platform)
    - occurred_at
    - aggregate_type
    - aggregate_id
    - data
  optional:
    - accounting_book_id
    - branch_id
    - actor_id
    - actor_type          # USER | SERVICE | SYSTEM | AI
    - correlation_id
    - causation_id
    - idempotency_key
    - source_system
    - metadata

rules:
  - event_id is globally unique.
  - event_type is immutable once published.
  - Breaking payload changes require a new event_version.
  - Consumers must be idempotent and record processed event_ids.
  - Financial consumers persist event_id and source traceability.
  - Outbox publication occurs only after the originating database transaction commits.
  - organization_id and legal_entity_id are indexed columns on outbox_events, not payload
    fields, so entity-scoped subscriptions and per-entity replay can filter on them (F-041).

# ---------------------------------------------------------------------------
# status:  new      = required by module prose, absent from the original catalog (F-102)
#          renamed  = original catalog name kept; `was` records the module-doc spelling (F-101)
#          split    = one doc name became two distinct events
# ---------------------------------------------------------------------------

